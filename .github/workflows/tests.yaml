name: Test CMOR
run-name: Test CMOR
on:
  push:
    branches:
      - "main"
      - "develop"
  pull_request:
    branches:
      - "main"
      - "develop"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff code checks
        run: |
          ruff check cmor tests
          ruff format cmor tests --check

  examples:
    name: Examples run without warnings
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run examples with RuntimeWarning as an error
        run: |
          set -euo pipefail
          for example in examples/example_*.py; do
            echo "::group::${example}"
            python -W error::RuntimeWarning "${example}" \
              --output-dir "${RUNNER_TEMP}/examples"
            echo "::endgroup::"
          done

  build:
    name: Build (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: ["ubuntu-latest", "macos-latest"]

    needs: lint

    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install udunits
            export UDUNITS2_INCDIR="$(brew --prefix)/include"
            export UDUNITS2_LIBDIR="$(brew --prefix)/lib"
            export UDUNITS2_XML_PATH=$(brew --prefix)/share/udunits/udunits2.xml
            export DYLD_LIBRARY_PATH=$(brew --prefix)/lib:$DYLD_LIBRARY_PATH
          fi
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Check type annotations with mypy
        run: |
          mypy --python-version ${{ matrix.python-version }} --explicit-package-bases cmor

      - name: Test with pytest and coverage
        run: |
          python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
