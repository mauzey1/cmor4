name: Deploy CMOR build
run-name: Deploy CMOR build
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: ["ubuntu-latest", "macos-latest"]

    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew install udunits
          export UDUNITS2_INCDIR="$(brew --prefix)/include"
          export UDUNITS2_LIBDIR="$(brew --prefix)/lib"
          export UDUNITS2_XML_PATH=$(brew --prefix)/share/udunits/udunits2.xml
          export DYLD_LIBRARY_PATH=$(brew --prefix)/lib:$DYLD_LIBRARY_PATH
          python -m pip install --upgrade pip
          pip install -e .

      - name: Test with pytest
        run: |
          pip install pytest pyfive
          pytest
