name: Deploy CMOR
run-name: Deploy CMOR
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff code checks
        run: |
          ruff check src tests
          ruff format src tests --check

  build:
    name: Build (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: ["ubuntu-latest", "macos-latest"]

    needs: lint

    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install udunits
            export UDUNITS2_INCDIR="$(brew --prefix)/include"
            export UDUNITS2_LIBDIR="$(brew --prefix)/lib"
            export UDUNITS2_XML_PATH=$(brew --prefix)/share/udunits/udunits2.xml
            export DYLD_LIBRARY_PATH=$(brew --prefix)/lib:$DYLD_LIBRARY_PATH
          fi
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with mypy
        run: |
          mypy --python-version ${{ matrix.python-version }} -p cmor4

      - name: Test with pytest
        run: |
          pytest
