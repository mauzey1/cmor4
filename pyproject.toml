[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmor4"
version = "4.0.0a1"
description = "Python package for creating CF-compliant climate model output in NetCDF format."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "cmor4 contributors" },
]
dependencies = [
  "cf-units>=3.3",
  "cftime>=1.6",
  "numpy>=1.24",
  "xarray>=2024.1",
  "pydantic>=2.0",
  "netCDF4>=1.6",
]

[project.optional-dependencies]
notebook = [
  "jupyterlab>=4",
  "matplotlib>=3.8",
  "basemap>=2",
  "pyproj>=3.7",
  "nbstripout>=0.9",
  "nbqa>=1.9",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.15",
  "mypy>=2.1",
  "sphinx>=7.0",
  "sphinx-autobuild>=2024.0",
  "furo>=2024.0",
  "cmip7-repack>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cmor4" = ["py.typed"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
files = ["src/cmor4", "tests"]

[[tool.mypy.overrides]]
module = ["cf_units.*", "cftime.*", "mpl_toolkits.basemap.*"]
ignore_missing_imports = true
