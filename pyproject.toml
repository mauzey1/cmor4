[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmor4"
version = "4.0.0a1"
description = "Python package for creating CF-compliant climate model output in NetCDF format."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "cmor4 contributors" },
]
dependencies = [
  "cf-units>=3.3",
  "cftime>=1.6",
  "numpy>=1.24",
  "xarray>=2024.1",
  "pydantic>=2.0",
  "netCDF4>=1.6",
]

[project.optional-dependencies]
notebook = [
  "jupyterlab>=4",
  "matplotlib>=3.8",
  "basemap>=2",
  "pyproj>=3.7",
  "nbstripout>=0.9",
  "black[jupyter]>=26.5",
]
dev = [
  "black>=26.5",
  "flake8>=7.3",
  "mypy>=2.1",
  "sphinx>=7.0",
  "sphinx-autobuild>=2024.0",
  "furo>=2024.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cmor4" = ["py.typed"]
